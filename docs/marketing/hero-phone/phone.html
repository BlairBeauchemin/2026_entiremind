<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Values sampled from the Muse reference (panel ~#FAFAFA, surfaces pure white,
     shadows ~4-5% alpha), with Entiremind cobalt as the single accent. */
  :root {
    --font: "Karla", system-ui, sans-serif;
    --cobalt: #2A3A9C;
    --ink: #111111;
    --muted: #6E7480;
    --panel-top: #FDFDFD;
    --panel-bot: #F7F7F7;
    --surface: #FFFFFF;
    --out-bg: #DDE3FB;          /* light cobalt */
    --tile-bg: #E9EDFC;
    --button-bg: #F3F5F7;
    --placeholder: #A9AEB7;
    --shadow: 0 1px 1px rgba(0,0,0,.02), 0 6px 24px rgba(0,0,0,.045);
    --panel-shadow: 0 0 0 1px rgba(0,0,0,.025), 0 20px 60px rgba(0,0,0,.05);
  }
  body.inter { --font: "Inter", system-ui, sans-serif; }
  body.sky { --out-bg: #CDE5FD; --tile-bg: #E6F4FF; }

  html, body { margin: 0; background: transparent; }
  body { width: 1024px; height: 1024px; position: relative; overflow: hidden;
         font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.inter { letter-spacing: -0.012em; }

  .panel { position: absolute; left: 289px; top: 33px; width: 445px; height: 966px;
           border-radius: 74px; box-shadow: var(--panel-shadow);
           background: linear-gradient(180deg, var(--panel-top), var(--panel-bot)); }

  .pill { position: absolute; left: 50%; top: 74px; transform: translateX(-50%);
          background: var(--surface); border-radius: 26px; padding: 22px 52px;
          font-weight: 700; font-size: 30px; box-shadow: var(--shadow); }

  .stack { position: absolute; left: 228px; top: 180px; width: 488px;
           display: flex; flex-direction: column; gap: 14px; }
  .bubble { background: var(--surface); border-radius: 30px; padding: 19px 26px;
            font-size: 22.5px; line-height: 1.36; font-weight: 500; box-shadow: var(--shadow);
            width: fit-content; max-width: 392px; }
  .in { align-self: flex-start; }
  .out { align-self: flex-end; background: var(--out-bg); max-width: 300px; }

  .card { margin-top: 14px; width: 416px; background: var(--surface); border-radius: 30px;
          padding: 20px; box-sizing: border-box; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .tile { width: 52px; height: 52px; border-radius: 14px; background: var(--tile-bg);
          display: grid; place-items: center; flex: none; }
  .title { font-weight: 600; font-size: 20px; line-height: 1.2; }
  .sub { color: var(--muted); font-size: 19px; font-weight: 500; margin-top: 2px; }
  .art { border-radius: 16px; overflow: hidden; border: 1px solid #F0F1F4; height: 104px; }
  .btn { margin-top: 14px; height: 50px; border-radius: 999px; background: var(--button-bg);
         display: grid; place-items: center; font-weight: 600; font-size: 19px; }

  .bar { position: absolute; left: 228px; top: 875px; width: 567px; height: 68px;
         background: var(--surface); border-radius: 999px; box-shadow: var(--shadow);
         display: flex; align-items: center; padding: 0 30px; box-sizing: border-box; gap: 20px; }
  .bar .ph { flex: 1; color: var(--placeholder); font-size: 27px; font-weight: 400; }
</style>
</head>
<body>
  <div class="panel"></div>
  <div class="pill">Entiremind</div>

  <div class="stack">
    <div class="bubble in">Morning, Maya. Yesterday you said you felt braver once you sent that email. What made it possible?</div>
    <div class="bubble out">Honestly? I stopped waiting to feel ready.</div>
    <div class="bubble in">That's the whole thing, isn't it. Ready shows up after you move.</div>

    <div class="card">
      <div class="card-head">
        <div class="tile">
          <svg width="26" height="26" viewBox="0 0 24 24"><path fill="#2A3A9C" d="M12 2.2l2.6 6.1 6.6.5-5 4.4 1.5 6.5L12 16.3l-5.7 3.4 1.5-6.5-5-4.4 6.6-.5z"/></svg>
        </div>
        <div>
          <div class="title">Your intention</div>
          <div class="sub">Open my studio by spring</div>
        </div>
      </div>
      <div class="art">
        <svg viewBox="0 0 376 124" width="100%" height="104" preserveAspectRatio="xMidYMid slice">
          <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFBFF"/><stop offset="1" stop-color="#EEF1FD"/></linearGradient></defs>
          <rect width="376" height="124" fill="url(#sky)"/>
          <g stroke="#9AA6EC" stroke-width="2.2" stroke-linecap="round">
            <line x1="188" y1="20" x2="188" y2="32"/><line x1="164" y1="28" x2="170" y2="37"/><line x1="212" y1="28" x2="206" y2="37"/>
            <line x1="150" y1="46" x2="160" y2="50"/><line x1="226" y1="46" x2="216" y2="50"/>
          </g>
          <path d="M162 72a26 26 0 0 1 52 0z" fill="#A9B3F0"/>
          <path d="M0 86 C70 62 124 68 188 78 C252 88 304 62 376 70 L376 124 L0 124Z" fill="#E1E6FB"/>
          <path d="M0 102 C84 80 156 90 220 100 C284 110 326 94 376 90 L376 124 L0 124Z" fill="#F0F2FD"/>
          <path d="M0 94 C70 74 124 76 178 84" fill="none" stroke="#7C89DE" stroke-width="2"/>
          <path d="M222 100 C284 110 326 94 376 90" fill="none" stroke="#7C89DE" stroke-width="2"/>
          <path d="M160 124 C130 108 210 102 198 94 C188 88 240 84 252 80" fill="none" stroke="#7C89DE" stroke-width="2"/>
          <ellipse cx="46" cy="70" rx="7" ry="18" fill="#B3BCF1"/><line x1="46" y1="80" x2="46" y2="96" stroke="#7C89DE" stroke-width="1.8"/>
          <ellipse cx="66" cy="64" rx="8" ry="21" fill="#B3BCF1"/><line x1="66" y1="76" x2="66" y2="94" stroke="#7C89DE" stroke-width="1.8"/>
          <path d="M318 92 v-14 M318 82 c-7-2-11-9-9-14 7 2 10 8 9 14 M318 82 c7-2 11-9 9-14 -7 2-10 8-9 14" stroke="#4A5AC6" stroke-width="1.8" fill="#6E7CD6"/>
        </svg>
      </div>
      <div class="btn">Open intention</div>
    </div>
  </div>

  <div class="bar">
    <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#111" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="ph">Message</div>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8A9099" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M5 9v6M9.5 6v12M14 9v6M18.5 7v10"/></svg>
  </div>
</body>
</html>
