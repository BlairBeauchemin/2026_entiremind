<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #2A3A9C;
    --cobalt-wash: #E7E9F4;
    --ink: #14120F;
    --muted: #6B6F7B;
    --panel: #F4F5F7;
    --bubble: #FFFFFF;
    --out-bg: #DCE1F7;
    --out-ink: #14120F;
    --card: #FFFFFF;
    --bar: #FFFFFF;
    --shadow: 0 1px 2px rgba(20,24,40,.04), 0 10px 30px rgba(20,24,40,.07);
    --panel-shadow: 0 2px 4px rgba(20,24,40,.03), 0 30px 80px rgba(20,24,40,.08);
  }
  /* B: warm, brand linen */
  body.warm {
    --panel: #F3F0EA;
    --bubble: #FFFDF9;
    --out-bg: #E7E9F4;
    --card: #FFFDF9;
    --bar: #FFFDF9;
    --muted: #7A7264;
    --shadow: 0 1px 2px rgba(40,30,10,.04), 0 10px 30px rgba(40,30,10,.07);
    --panel-shadow: 0 2px 4px rgba(40,30,10,.03), 0 30px 80px rgba(40,30,10,.08);
  }
  /* C: solid cobalt replies */
  body.solid { --out-bg: var(--cobalt); --out-ink: #FFFFFF; }

  html, body { margin: 0; background: transparent; }
  body { width: 1024px; height: 1024px; position: relative; overflow: hidden;
         font-family: "Karla", system-ui, sans-serif; color: var(--ink);
         -webkit-font-smoothing: antialiased; }

  .panel { position: absolute; left: 287px; top: 36px; width: 450px; height: 948px;
           background: var(--panel); border-radius: 76px; box-shadow: var(--panel-shadow); }

  .pill { position: absolute; left: 50%; top: 78px; transform: translateX(-50%);
          background: var(--bubble); border-radius: 999px; padding: 18px 44px;
          font-weight: 700; font-size: 29px; letter-spacing: -.01em; box-shadow: var(--shadow); }

  .bubble { position: absolute; background: var(--bubble); border-radius: 30px;
            padding: 20px 28px; font-size: 25px; line-height: 1.32; font-weight: 500;
            box-shadow: var(--shadow); letter-spacing: -.005em; }
  .in { left: 228px; }
  .out { right: 300px; background: var(--out-bg); color: var(--out-ink); }

  .card { position: absolute; left: 265px; top: 560px; width: 400px; background: var(--card);
          border-radius: 30px; padding: 22px; box-shadow: var(--shadow); box-sizing: border-box; }
  .card-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .tile { width: 58px; height: 58px; border-radius: 15px; background: var(--cobalt);
          display: grid; place-items: center; flex: none; }
  .title { font-weight: 700; font-size: 23px; line-height: 1.15; }
  .sub { color: var(--muted); font-size: 20px; font-weight: 500; margin-top: 3px; }
  .art { border-radius: 16px; overflow: hidden; background: #EEF0FB; height: 132px; }

  .bar { position: absolute; left: 232px; top: 876px; width: 548px; height: 72px;
         background: var(--bar); border-radius: 999px; box-shadow: var(--shadow);
         display: flex; align-items: center; padding: 0 28px; box-sizing: border-box; gap: 18px; }
  .bar .ph { flex: 1; color: #9AA0AE; font-size: 26px; font-weight: 500; }

  /* C variant: card floats outside, tilted */
  body.float .card { left: 150px; top: 600px; transform: rotate(-5deg); }

  .stack { position: absolute; left: 222px; top: 172px; width: 540px; display: flex;
           flex-direction: column; gap: 16px; }
  .stack .bubble { position: static; max-width: 400px; width: fit-content; }
  .stack .in { align-self: flex-start; }
  .stack .out { align-self: flex-end; margin-right: -22px; max-width: 330px; }
  .stack .card { position: static; margin: 8px 0 0 34px; }
  body.float .stack .card { margin: 14px 0 0 -70px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="panel"></div>
  <div class="pill">Entiremind</div>

  <div class="stack">
    <div class="bubble in">Morning, Maya. Yesterday you said you felt braver once you sent that email. What made it possible?</div>
    <div class="bubble out">Honestly? I stopped waiting to feel ready.</div>
    <div class="bubble in">That's the whole thing, isn't it. Ready shows up after you move.</div>
    <div class="card">
    <div class="card-head">
      <div class="tile">
        <svg width="28" height="28" viewBox="0 0 24 24"><path fill="#fff" d="M12 2.2l2.6 6.1 6.6.5-5 4.4 1.5 6.5L12 16.3l-5.7 3.4 1.5-6.5-5-4.4 6.6-.5z"/></svg>
      </div>
      <div>
        <div class="title">Your intention</div>
        <div class="sub">Open my studio by spring</div>
      </div>
    </div>
    <div class="art">
      <svg viewBox="0 0 356 160" width="100%" height="132" preserveAspectRatio="none">
        <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F4FD"/><stop offset="1" stop-color="#E6E9FA"/></linearGradient></defs>
        <rect width="356" height="160" fill="url(#sky)"/>
        <g stroke="#8E9BE6" stroke-width="2.4" stroke-linecap="round">
          <line x1="178" y1="34" x2="178" y2="48"/><line x1="152" y1="44" x2="159" y2="54"/><line x1="204" y1="44" x2="197" y2="54"/>
          <line x1="138" y1="64" x2="149" y2="68"/><line x1="218" y1="64" x2="207" y2="68"/>
        </g>
        <path d="M150 92a28 28 0 0 1 56 0z" fill="#9AA6EC"/>
        <path d="M0 110 C70 80 120 86 178 98 C240 110 290 78 356 88 L356 160 L0 160Z" fill="#D9DEF8"/>
        <path d="M0 128 C80 100 150 112 210 124 C270 136 310 116 356 112 L356 160 L0 160Z" fill="#E8EBFB"/>
        <path d="M0 120 C70 96 120 98 170 106" fill="none" stroke="#6D7BD8" stroke-width="2.2"/>
        <path d="M210 124 C270 136 310 116 356 112" fill="none" stroke="#6D7BD8" stroke-width="2.2"/>
        <path d="M150 160 C120 140 200 132 186 122 C176 114 230 110 240 106" fill="none" stroke="#6D7BD8" stroke-width="2.2"/>
        <ellipse cx="44" cy="92" rx="8" ry="20" fill="#A7B1EE"/><line x1="44" y1="104" x2="44" y2="122" stroke="#6D7BD8" stroke-width="2"/>
        <ellipse cx="66" cy="86" rx="9" ry="24" fill="#A7B1EE"/><line x1="66" y1="100" x2="66" y2="120" stroke="#6D7BD8" stroke-width="2"/>
        <path d="M300 114 v-16 M300 104 c-8-2-12-10-10-16 8 2 11 9 10 16 M300 104 c8-2 12-10 10-16 -8 2-11 9-10 16" stroke="#3E4FC0" stroke-width="2" fill="#5C6BD0"/>
      </svg>
    </div>
  </div>

  </div>

  <div class="bar">
    <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#14120F" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div class="ph">Message</div>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A7F8C" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" stroke="#14120F" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6M8 6v12M12 9v6M16 5v14M20 10v4"/></svg>
  </div>
</body>
</html>
